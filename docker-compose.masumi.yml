services:
  cardano:
    build:
      context: .
      dockerfile: Dockerfile.masumi
    image: ocnif-bc-cardano:masumi-dev
    env_file: masumi/.env
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 8096
    ports: ["${MASUMI_PORT:-8098}:8096"]
    restart: unless-stopped
    read_only: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.AGENT_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
